name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    # Manual trigger

env:
  NODE_VERSION: "20"
  DOCKER_IMAGE: nodejs-api
  DOCKER_CACHE_TAG: cache
  MONGO_URI: mongodb://localhost:27017/test-db

jobs:
  # STEP 1: RUN TESTS
  test:
    name: Test Application
    runs-on: ubuntu-latest

    services:
      # Setup MongoDB service container for tests
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint || echo "Linting skipped - No lint script"

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key
          MONGO_URI: ${{ env.MONGO_URI }}

  # STEP 2: BUILD AND PUSH DOCKER IMAGE
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          # Configure for your container registry (GitHub, DockerHub, etc.)
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          target: production
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_CACHE_TAG }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_CACHE_TAG }},mode=max

  # STEP 3: DEPLOY TO STAGING (If you prefer manual deployment to production)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to staging server
        # Replace with your deployment strategy (SSH, Kubernetes, etc.)
        # This is a placeholder example using SSH deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /path/to/deployment
            docker-compose down
            docker-compose pull
            docker-compose up -d

            # Health check
            attempt=1
            max_attempts=5
            until $(curl --output /dev/null --silent --head --fail http://localhost:3000/health); do
              if [ $attempt -eq $max_attempts ]; then
                echo "Failed to verify health endpoint after $max_attempts attempts"
                exit 1
              fi
              echo "Waiting for service to be available (attempt $attempt/$max_attempts)..."
              sleep 10
              ((attempt++))
            done
            echo "Deployment successful!"

  # STEP 4: DEPLOY TO PRODUCTION (Manual approval required)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://your-production-api.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to production server
        # Replace with your deployment strategy (SSH, Kubernetes, etc.)
        # This is a placeholder example using SSH deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /path/to/production/deployment
            echo "Pulling latest image..."
            docker-compose pull

            echo "Backing up database..."
            docker exec nodejs-mongo mongodump --archive=/tmp/db-backup-$(date +%Y%m%d%H%M%S).gz --gzip

            echo "Deploying new version..."
            docker-compose down
            docker-compose up -d

            # Health check and rollback if needed
            attempt=1
            max_attempts=5
            until $(curl --output /dev/null --silent --head --fail http://localhost:3000/health); do
              if [ $attempt -eq $max_attempts ]; then
                echo "Deployment failed! Rolling back..."
                docker-compose down
                docker-compose -f docker-compose.previous.yml up -d
                exit 1
              fi
              echo "Waiting for service to be available (attempt $attempt/$max_attempts)..."
              sleep 10
              ((attempt++))
            done
            echo "Deployment successful!"
